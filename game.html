<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Héritage d'Anubis - Le Tombeau Perdu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --gold: #d4af37;
            --ocre: #b87333;
            --lapis: #1e3a5f;
            --panel: rgba(10, 10, 10, 0.4);
            --text: #e0d5c0;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #000; color: var(--text);
            font-family: 'Crimson Text', serif;
            overflow: hidden;
        }

        #scene-container {
            position: relative; width: 100vw; height: 100vh; height: 100svh; 
            background-color: #000; background-size: cover; background-position: center;
            background-repeat: no-repeat; transition: background-image 0.8s ease-in-out;
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden;
        }

        #top-bar {
            position: absolute; top: 0; width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            padding: 10px 25px; display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; z-index: 100;
        }
        #player-name { font-family: 'Cinzel', serif; color: var(--gold); letter-spacing: 2px; }

        #ui-panel {
            background: var(--panel); border-top: 2px solid var(--gold);
            padding: 20px 40px; min-height: 150px;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.8); z-index: 10;
            text-align: center; backdrop-filter: blur(4px);
        }
        
        #description-text { font-size: 1.3rem; line-height: 1.4; margin-bottom: 20px; font-style: italic; }

        #choices-grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

        .btn-game {
            background: rgba(42, 29, 21, 0.8); color: var(--gold); border: 1px solid var(--gold);
            padding: 10px 25px; font-family: 'Cinzel', serif; cursor: pointer; transition: 0.3s;
        }
        .btn-game:hover { background: var(--ocre); color: white; box-shadow: 0 0 15px var(--gold); }

        #inventory-panel {
            margin-top: 15px; padding-top: 10px; border-top: 1px solid rgba(212, 175, 55, 0.2);
            font-size: 0.85rem; color: var(--gold); font-family: 'Cinzel', serif; opacity: 0.7;
        }

        /* MODALE OBJET */
        .item-modal-content {
            background: linear-gradient(145deg, #1a1a1a, #000); border: 3px solid var(--gold);
            width: 90%; max-width: 800px; display: flex; padding: 0; overflow: hidden;
            box-shadow: 0 0 100px rgba(212, 175, 55, 0.3); animation: modalFadeIn 0.5s ease-out;
        }
        .item-modal-left { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; border-right: 1px solid rgba(212, 175, 55, 0.2); }
        .item-modal-left img { max-width: 100%; max-height: 200px; filter: drop-shadow(0 0 20px var(--gold)); }
        .item-modal-right { flex: 1.5; padding: 40px; text-align: left; }
        
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>

        /**
         * Joue un effet sonore ponctuel
         */
        function playSound(name) {
            // On vérifie que le son existe ET n'est pas null avant de le jouer
            if (sounds[name] && sounds[name] instanceof Audio) {
                sounds[name].currentTime = 0;
                sounds[name].play().catch(e => console.warn("Audio bloqué"));
            }
        }

        /**
         * Nettoie une réponse joueur : minuscule, espaces superflus retirés,
         * ET accents supprimés (pour accepter "scarabée" comme "scarabee").
         */
        function normalize(str) {
            return str
                .toLowerCase()
                .trim()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, ""); // supprime les accents
        }

        /**
         * Arrête proprement tous les sons d'ambiance qui bouclent
         */
        function stopAllAmbiance() {
            // On coupe automatiquement TOUT son actuellement en boucle,
            // peu importe le nom : plus besoin de maintenir une liste à jour
            // à chaque nouvelle zone ajoutée.
            Object.values(sounds).forEach(s => {
                if (s.loop) {
                    s.pause();
                    s.loop = false;
                    s.currentTime = 0;
                }
            });
        }

        /**
         * Coupe TOUS les sons (ambiances + effets ponctuels), sans exception.
         * Utile juste avant un changement de scène pour ne pas laisser un effet
         * sonore de l'énigme précédente se terminer par-dessus la nouvelle scène.
         */
        function stopAllSounds() {
            Object.values(sounds).forEach(s => {
                s.pause();
                s.currentTime = 0;
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                userData = userDoc.data() || {};
                
                if (!Array.isArray(userData.inventory)) userData.inventory = [];
                document.getElementById('player-name').innerText = userData.pseudo || "Explorateur";
                
                if (currentActiveScene !== userData.currentScene) {

        // --- AJOUT D'OBJET SÉCURISÉ (Évite les doublons) ---
        async function ajouterObjet(nomObjet) {
            // 1. On vérifie si l'inventaire existe, sinon on crée un tableau vide
            if (!Array.isArray(userData.inventory)) {
                userData.inventory = [];
            }

            // 2. On vérifie si l'objet est DÉJÀ dans le sac
            if (!userData.inventory.includes(nomObjet)) {
                // Il n'y est pas, donc on l'ajoute
                userData.inventory.push(nomObjet);
                
                // 3. On met à jour l'affichage immédiatement
                document.getElementById('inventory-list').innerText = userData.inventory.join(", ");
                
                // 4. On enregistre dans Firebase
                try {
                    await updateDoc(doc(db, "users", currentUser.uid), { 
                        inventory: userData.inventory 
                    });
                    console.log(nomObjet + " ajouté avec succès !");
                } catch (e) {
                    console.error("Erreur sauvegarde inventaire:", e);
                }
            } else {
                // L'objet est déjà là, on ne fait rien (pas de doublon !)
                console.log(nomObjet + " est déjà dans l'inventaire.");
            }
        }

        function renderScene(sceneId) {
            const scene = scenes[sceneId];
            if (!scene) return;

            // --- GESTION DE L'AMBIANCE CORRIGÉE ---
            if (scene.ambience && sounds[scene.ambience]) {
                // Si le son demandé n'est pas déjà en train de jouer
                if (sounds[scene.ambience].paused) {
                    stopAllAmbiance(); // On arrête tout l'ancien
                    sounds[scene.ambience].loop = true;
                    sounds[scene.ambience].play().catch(() => {});
                }
            } else {
                // Si la scène n'a pas d'ambiance, on fait le silence total
                stopAllAmbiance();
            }

            document.getElementById('scene-container').style.backgroundImage = `url('${scene.image}')`;
            document.getElementById('description-text').innerText = scene.text;
            
            const grid = document.getElementById('choices-grid');
            grid.innerHTML = "";

            scene.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "btn-game";
                btn.innerText = choice.text;
                btn.onclick = () => {
                    if (choice.next) changeScene(choice.next);
                    if (choice.action) choice.action();
                };
                grid.appendChild(btn);
            });

            document.getElementById('inventory-list').innerText = userData.inventory.length > 0 ? userData.inventory.join(", ") : "Vide";
        }

            stopAllSounds(); // On coupe net tout ce qui joue avant d'entrer dans la nouvelle scène

            renderScene(newSceneId);
            await updateDoc(doc(db, "users", currentUser.uid), { currentScene: newSceneId });
        }

        } 

        function donnerIndiceReservoir() {
            UI.message("L'inscription dit : 'La vérité réside dans le reste. Remplis la grande jarre (5L), verse-la dans la petite (3L) jusqu'au bord. Ce qui reste dans la grande est ton premier pas. Recommence pour atteindre le but (4L).'", null, "assets/images/items/volume_indice.webp");
        }

        function enigmeReservoir() {
            if (isBusy) return;
            
            if (!userData.inventory.includes("Vase Canope (Hapi)")) {
                UI.message("Vous avez besoin d'un récipient sacré pour puiser l'eau du bassin.");
                return;
            }
        
            UI.ask("Après avoir versé la jarre de 5L dans celle de 3L, combien de litres reste-t-il ? Et combien de fois faut-il verser ce reste pour obtenir 4L ?", async (rep) => {
                const answer = normalize(rep);
                
                // On accepte si la réponse contient "2" ou "deux"
                if (answer.includes("2") || answer.includes("deux")) {
                    isBusy = true;
                    playSound('remplissage_eau');
                    
                    setTimeout(async () => {
                        playSound('success');
                        playSound('mecanisme_hydraulique');
                        await ajouterObjet("Ankh de Bronze");
                        userData.inventory = userData.inventory.filter(i => i !== "Vase Canope (Hapi)");
                        await updateDoc(doc(db, "users", currentUser.uid), { inventory: userData.inventory });
        
                        UI.showItem(
                            "Ankh de Bronze", 
                            "Exact ! 5L - 3L = 2L. En versant ce reste deux fois (2 + 2), vous obtenez 4L. La pression libère l'Ankh !", 
                            "assets/images/items/ankh_item.webp", 
                            () => { isBusy = false; changeScene("reservoir_resolu"); }
                        );
                    }, 1500);
                } else {
                    playSound('error');
                    UI.message("Le mécanisme ne réagit pas. Calculez le reste : 5L moins 3L...");
                }
            }, "assets/images/items/volume_indice.webp");
        }

        function donnerIndiceRampe() {
            UI.message("L'inscription dit : 'La pierre ne rejoindra les cieux que si la rampe adopte l'angle du Triangle Parfait, celui où les trois côtés sont égaux.'", null, "assets/images/items/triangle_indice.webp");
        }
        function enigmeRampe() {
            if (isBusy) return;
            
            // Vérification de l'Ankh (item étape 8)
            if (!userData.inventory.includes("Ankh de Bronze")) {
                UI.message("Le bloc est verrouillé par un mécanisme de bronze. Il vous manque la clé en forme d'Ankh.");
                return;
            }

            // On utilise l'illustration triangle_indice.webp
            UI.ask("À quel angle (en degrés) réglez-vous l'inclinaison de la rampe pour qu'elle corresponde à un triangle aux trois côtés égaux ?", async (rep) => {
                const answer = rep.trim();
                
                // La réponse est 60 (angle d'un triangle équilatéral)
                if (answer === "60" || answer === "60°" || answer.toLowerCase() === "soixante") {
                    isBusy = true;
                    playSound('insertion_metal');
                    
                    setTimeout(() => {
                        playSound('frottement_pierre_lourde');
                        
                        setTimeout(async () => {
                            playSound('success');
                            playSound('clic_mecanisme');
                            
                            // Récompense : Fragment de Carte Stellaire
                            await ajouterObjet("Carte Stellaire");
                            
                            // On retire l'Ankh car il reste inséré dans le mécanisme
                            userData.inventory = userData.inventory.filter(i => i !== "Ankh de Bronze");
                            await updateDoc(doc(db, "users", currentUser.uid), { inventory: userData.inventory });

                            UI.showItem(
                                "Carte Stellaire", 
                                "Le bloc atteint le sommet ! Le Triangle Parfait (60°) était la clé. Vous récupérez un fragment de basalte gravé d'étoiles d'or. C'est un guide pour la Chambre du Sarcophage.", 
                                "assets/images/items/carte_stellaire_item.webp", 
                                () => {
                                    isBusy = false;
                                    changeScene("rampe_resolue");
                                }
                            );
                        }, 2000); // Délai pour simuler le glissement de la pierre
                    }, 800);
                } else {
                    playSound('error');
                    UI.message("Vous réglez l'angle, mais le bloc est trop lourd ou la pente trop faible. Le mécanisme refuse de s'enclencher.");
                }
            }, "assets/images/items/triangle_indice.webp");
        }

        function donnerIndiceHorloge() {
            UI.message("Votre carte indique : 'Sirius doit briller au zénith (12ème heure). Actuellement, l'étoile est à la 6ème heure. Chaque tour de levier fait avancer le ciel de 3 heures.'", null, "assets/images/items/horloge_indice.webp");
        }

        function enigmeHorloge() {
            if (isBusy) return;
            
            if (!userData.inventory.includes("Carte Stellaire")) {
                UI.message("Sans la carte stellaire, vous ne saurez pas comment aligner les astres.");
                return;
            }
        
            UI.ask("Combien de fois actionnez-vous le levier pour amener Sirius (6h) jusqu'au zénith (12h) ?", async (rep) => {
                const answer = normalize(rep); // On utilise ta fonction normalize !
                
                // On vérifie si la réponse contient "2" ou "deux"
                if (answer.includes("2") || answer.includes("deux")) {
                    isBusy = true;
                    playSound('engrenage_pierre');
                    
                    setTimeout(() => {
                        playSound('faisceau_stellaire');
                        setTimeout(async () => {
                            playSound('success');
                            playSound('declic_magique');
                            await ajouterObjet("Amulette Oudjat");
                            UI.showItem(
                                "Amulette Oudjat", 
                                "L'alignement est atteint ! Sirius brille au zénith. Vous récupérez l'œil sacré qui voit à travers les illusions.", 
                                "assets/images/items/oudjat_item.webp", 
                                () => { isBusy = false; changeScene("horloge_resolue"); }
                            );
                        }, 1500); 
                    }, 1000);
                } else {
                    playSound('error');
                    UI.message("Le ciel pivote mais Sirius n'est pas encore au zénith. (Indice: 1 tour = 3h)");
                }
            }, "assets/images/items/horloge_indice.webp");
        }

        function donnerIndiceRunes() {
            UI.message("Les murmures disent : 'Reçois le souffle de Vie, traverse l'éclat du Jour, et accomplis ta Transformation.' Observez bien l'ordre des symboles.", null, "assets/images/items/rune_indice.webp");
        }

        function enigmeRunes() {
            if (isBusy) return;
            
            // On vérifie que le joueur possède l'Amulette Oudjat (item étape 10)
            // Car c'est l'œil qui permet de "voir" la magie des runes
            if (!userData.inventory.includes("Amulette Oudjat")) {
                UI.message("Les symboles semblent flous. Il vous manque l'œil sacré pour percevoir l'ordre véritable de ces runes.");
                return;
            }

            // On utilise l'illustration rune_indice.webp pour aider le joueur
            UI.ask("Dans quel ordre pressez-vous les trois symboles (DISQUE-ANKH-SCARABEE) ? (Séparez par des tirets)", async (rep) => {
                const answer = normalize(rep).replace(/ /g, "-");
                
                // Ordre attendu : Vie (Ankh) -> Jour (Disque) -> Transformation (Scarabée)
                if (answer.includes("ankh") && answer.includes("disque") && answer.includes("scarabee") && 
                    answer.indexOf("ankh") < answer.indexOf("disque") && 
                    answer.indexOf("disque") < answer.indexOf("scarabee")) {
                    
                    isBusy = true;
                    playSound('cliquetis_bijoux');
                    
                    setTimeout(() => {
                        playSound('success');
                        playSound('glissement_or');
                        
                        setTimeout(async () => {
                            // Récompense : Le Pilier Djed
                            await ajouterObjet("Pilier Djed");
                            
                            // On peut garder l'amulette (elle servira plus tard)
                            
                            UI.showItem(
                                "Pilier Djed", 
                                "Le cycle est respecté ! La parure s'ouvre pour vous offrir le Pilier Djed. Ce symbole de stabilité est la deuxième clé nécessaire pour sceller le sarcophage et sortir d'ici.", 
                                "assets/images/items/djed_item.webp", 
                                () => {
                                    isBusy = false;
                                    changeScene("runes_resolu");
                                }
                            );
                        }, 1500);
                    }, 800);
                } else {
                    playSound('error');
                    UI.message("Les joyaux s'enfoncent mais se bloquent aussitôt. Ce n'est pas le cycle de l'éternité.");
                }
            }, "assets/images/items/rune_indice.webp");
        }

        function fouillerTresor() {
            if (isBusy) return;
            
            // On vérifie si le joueur a déjà le miroir
            if (userData.inventory.includes("Miroir de Bronze")) {
                UI.message("Vous avez déjà récupéré tout ce qui semblait utile dans ce tas d'or.");
                return;
            }

            isBusy = true;
            playSound('cliquetis_or');
            
            setTimeout(async () => {
                await ajouterObjet("Miroir de Bronze");
                UI.showItem(
                    "Miroir de Bronze", 
                    "En écartant quelques statuettes, vous découvrez un miroir de bronze poli. Il est si brillant qu'il semble capturer la moindre lueur de vos torches.", 
                    "assets/images/items/miroir_item.webp", 
                    () => {
                        isBusy = false;
                        renderScene("porte_gardiens");
                    }
                );
            }, 1000);
        }

        function enigmeGardien() {
            if (isBusy) return;
            
            // Sécurité : il faut le miroir
            if (!userData.inventory.includes("Miroir de Bronze")) {
                UI.message("Vous essayez de passer, mais le Gardien émet un son de basse fréquence qui vous fait reculer. Il vous faut un moyen de neutraliser son regard.");
                return;
            }

            // On utilise l'illustration miroir_indice.webp
            UI.ask("Le Gardien ne craint pas l'ombre, mais il est terrassé par le reflet de sa propre splendeur. Que faites-vous avec le miroir ?", async (rep) => {
                const answer = normalize(rep);
                
                // On accepte des mots comme "refléter", "éblouir", "lumière", "yeux"
                if (answer.includes("reflet") || answer.includes("refleter") || answer.includes("eblouir") || answer.includes("lumiere") || answer.includes("yeux")) {
                    isBusy = true;
                    playSound('faisceau_lumineux');
                    
                    setTimeout(() => {
                        playSound('success');
                        playSound('pierre_lourde_ouverture');
                        
                        setTimeout(async () => {
                            // On retire le miroir car il reste utilisé pour bloquer le gardien (ou on le garde, au choix)
                            userData.inventory = userData.inventory.filter(i => i !== "Miroir de Bronze");
                            await updateDoc(doc(db, "users", currentUser.uid), { inventory: userData.inventory });

                            UI.message("Le rayon de lumière frappe les yeux de cristal du colosse ! Dans un fracas massif, le Gardien s'efface dans le mur.", () => {
                                isBusy = false;
                                changeScene("gardien_vaincu");
                            });
                        }, 2000);
                    }, 1000);
                } else {
                    playSound('error');
                    UI.message("La statue reste impassible. Votre action n'a aucun effet sur son regard de pierre.");
                }
            }, "assets/images/items/miroir_indice.webp");
        }

        function donnerIndiceSceau() {
            UI.message("L'inscription dit : 'La Vie est offerte en premier (Ankh). Le Regard s'ouvre ensuite sur le monde (Oudjat). La Stabilité finit par s'établir pour l'éternité (Djed).'", null, "assets/images/items/ordre_indice.webp");
        }

        function enigmeSceau() {
            if (isBusy) return;
            
            // Vérification des objets (Oudjat et Djed sont obligatoires)
            if (!userData.inventory.includes("Amulette Oudjat") || !userData.inventory.includes("Pilier Djed")) {
                UI.message("Il vous manque des artefacts sacrés pour activer ce mécanisme.");
                return;
            }

            // On utilise l'illustration ordre_indice.webp
            UI.ask("Dans quel ordre insérez-vous les trois artefacts sur l'autel (OUDJAT-DJED-ANKH) ?", async (rep) => {
                const answer = normalize(rep).replace(/ /g, "-");
                
                // Ordre attendu : Ankh -> Oudjat (Oeil) -> Djed (Pilier)
                if (answer.includes("ankh") && answer.includes("oudjat") && answer.includes("djed") && 
                    answer.indexOf("ankh") < answer.indexOf("oudjat") && 
                    answer.indexOf("oudjat") < answer.indexOf("djed")) {
                    
                    isBusy = true;
                    playSound('clic_pierre_precieuse');
                    
                    setTimeout(() => {
                        playSound('success');
                        playSound('mecanisme_final');
                        playSound('triomphe_egypte');
                        
                        setTimeout(async () => {
                            // Récompense : La Bague du Pharaon
                            await ajouterObjet("Bague du Pharaon");
                            
                            // On vide les artefacts de l'inventaire car ils sont posés
                            userData.inventory = userData.inventory.filter(i => 
                                i !== "Amulette Oudjat" && i !== "Pilier Djed" && i !== "Miroir de Bronze"
                            );
                            await updateDoc(doc(db, "users", currentUser.uid), { inventory: userData.inventory });

                            UI.showItem(
                                "Bague du Pharaon", 
                                "Le Sceau Royal est activé ! Le pont vers la sortie s'est déployé au-dessus du vide. Vous récupérez la bague du souverain, preuve de votre succès.", 
                                "assets/images/items/bague_item.webp", 
                                () => {
                                    isBusy = false;
                                    changeScene("sceau_resolu");
                                }
                            );
                        }, 2000);
                    }, 1000);
                } else {
                    playSound('error');
                    UI.message("Les artefacts rejettent l'autel. L'ordre de la Création n'a pas été respecté.");
                }
            }, "assets/images/items/ordre_indice.webp");
        }

        function donnerIndiceFinal() {
            UI.message("À l'intérieur de la bague, trois chiffres sont ciselés dans l'or. On dirait un code de secours universel ou le matricule d'un célèbre archéologue : 9-1-1.");
        }

        async function enigmeFinal() {
            if (isBusy) return;

            UI.ask("Entrez le code gravé sur la bague pour déverrouiller la porte de sortie :", async (rep) => {
                if (rep.trim() === "911") {
                    isBusy = true;
                    playSound('pas_pierre');
                    
                    setTimeout(() => {
                        playSound('porte_soleil');
                        playSound('success');
                        
                        setTimeout(async () => {
                            // 1. Enregistrement dans le Hall of Fame
                            try {
                                // On utilise setDoc avec l'UID de l'utilisateur pour qu'il n'ait qu'une seule entrée
                                await setDoc(doc(db, "winners", currentUser.uid), {
                                    pseudo: userData.pseudo,
                                    date: serverTimestamp()
                                });
                            } catch (e) { 
                                console.error("Erreur Hall of Fame:", e); 
                            }

                            // 2. Passage à la scène de victoire
                            changeScene("victoire");
                            isBusy = false;
                        }, 2000);
                    }, 1000);
                } else {
                    playSound('error');
                    UI.message("Le verrou ne bouge pas. Le code est incorrect.");
                }
            });
        }

        async function afficherHallOfFame() {
            try {
                const q = query(collection(db, "winners"), orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);
                
                let liste = "LISTE DES GRANDS ARCHÉOLOGUES :\n\n";
                querySnapshot.forEach((doc) => {
                    liste += "- " + doc.data().pseudo + "\n";
                });

                // On utilise la modale parchemin avec l'image hall_fame.webp
                UI.message(liste, null, "assets/images/items/hall_fame.webp");
            } catch (e) {
                UI.message("Impossible de lire les archives pour le moment.");
            }
        }
        

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
